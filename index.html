}

 return `<h1>믿음 깨기</h1><p class="mut">책은 술에 대한 흔한 믿음을 하나씩 뒤집습니다. 눌러서 펼쳐 보세요.</p>`+
 M.map(m=>`<details class="my"><summary>${m[0]}</summary><p>${m[1]}</p><p class="mind" style="font-size:17px">스스로에게 묻기: ${m[2]}</p></details>`).join("");
}
function rules(){
 return `<h1>핵심 원칙</h1><p class="mut">책의 지침을 짧게 정리했습니다. 원문은 책에서 확인하세요.</p>`+
 P.map((p,n)=>`<div class="pr"><b>${n+1}. ${p[0]}</b>${p[1]}</div>`).join("");
}
function pledge(){
 const ck=JSON.parse(sg("ck","[]"));
 return `<h1>나의 결단</h1><p class="mut">이 기기에만 저장되며 다른 곳으로 전송되지 않습니다.</p>
 <h2>내 결단문 한 줄</h2>
 <textarea id="pl" placeholder="예: 나는 마지막 잔을 마셨고, 이제 술이 필요 없다.">${sg("pl","")}</textarea>
 <h2>술자리 전 점검</h2>`+
 CK.map((c,n)=>`<label class="c"><input type="checkbox" data-c="${n}" ${ck.includes(n)?"checked":""}><span>${c}</span></label>`).join("")+
 `<button class="back" id="rs">점검 초기화</button>`;
}
function help(){
 return `<h1>도움받기</h1>
 <div class="warn"><b>이 앱은 책의 관점을 정리한 것이며 의료 조언이 아닙니다.</b></div>
 <h2>이런 경우에는 전문가를 만나세요</h2>
 <ul class="l"><li>필름이 자주 끊기거나, 취하면 욕설과 폭력성이 나오는 일이 반복될 때</li>
 <li>마음먹어도 첫 잔 뒤에 멈추지 못하는 일이 반복될 때</li>
 <li>평소 자주 많이 마시다 끊었는데 손떨림, 심한 불면, 극심한 불안이 올 때 (이 경우 먼저 진료가 필요합니다)</li></ul>
 <h2>연락처</h2>
 <div class="box">정신건강위기상담전화 <a href="tel:1577-0199">1577-0199</a><br><span class="mut">지역 정신건강복지센터나 정신건강의학과에서 알코올 문제 상담을 받을 수 있습니다.</span></div>
 <p class="mut">도움을 받는 것은 약해서가 아니라, 가장 빠르고 안전한 방법입니다.</p>`;
}
function render(){
 app.innerHTML={sos,myth,rules,pledge,help}[tab]();
 nav.innerHTML=[["sos","지금 도움"],["myth","믿음 깨기"],["rules","원칙"],["pledge","결단"],["help","도움받기"]]
  .map(a=>`<button data-t="${a[0]}" aria-current="${tab===a[0]}">${a[1]}</button>`).join("");
 const bk=document.getElementById("bk");if(bk)bk.onclick=()=>{cur=null;render();scrollTo(0,0)};
 app.querySelectorAll(".sit").forEach(b=>b.onclick=()=>{cur=+b.dataset.n;render();scrollTo(0,0)});
 nav.querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;cur=null;render();scrollTo(0,0)});
 const pl=document.getElementById("pl");if(pl)pl.oninput=()=>ss("pl",pl.value);
 app.querySelectorAll("input[data-c]").forEach(i=>i.onchange=()=>{
  const l=[...app.querySelectorAll("input[data-c]")].filter(x=>x.checked).map(x=>+x.dataset.c);ss("ck",JSON.stringify(l))});
 const rs=document.getElementById("rs");if(rs)rs.onclick=()=>{ss("ck","[]");render()};
}
render();

if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
